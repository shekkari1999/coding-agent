[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coding-agent"
version = "0.1.0"
description = "A cost-efficient coding agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "langgraph>=0.2",
]

[project.scripts]
agent = "agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["agent", "eval"]
